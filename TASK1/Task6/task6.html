<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Variable Behaviour Program
        </title>
    </head>
    <body>
        <script>

            // Declaring variables using var, let, and const

            var a = 10;
            let b = 20;
            const c = 30; //const cannot be change later

            // Reassigning values (only allowed for var and let)

            a = 15;
            b = 25;

            // Displaying values

            console.log(`var a: ${a}`);
            console.log(`let b: ${b}`);
            console.log(`const c: ${c}`);

        </script>

    </body>
</html>
