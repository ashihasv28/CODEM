<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Template Literal Output Program
        </title>
    </head>
    <body>
        <script>

            //creating variable to store
            let name = 'Ashiha'; //name
            let role = 'Student'; //role
            let organization = 'Government College of Engineering'; //college

            //using template literals to display 

            console.log(`My name is ${name}. I am a ${role} at ${organization}.`); //template literals by interpolation

        </script>
    </body>
</html>
