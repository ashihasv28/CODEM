<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Information Program</title>
    </head>
    <body>
        <script>
            //Personal details
            let fullName = 'Ashiha'; //Full name
            let emailID = 'ashihasv28@gmail.com'; //emailID
            let currentYear = 2026; //current year

            //Creating numeric variables
            let number1 = 20; 
            let number2 = 10;

            //Performing different mathematical operations
            let addition = number1 + number2;
            let subtraction = number1 - number2;
            let multiplication = number1 * number2;
            let division = number1 / number2;
            let modulus = number1 % number2;

            //Displaying Personal details
            console.log(`Full Name:${fullName}`);
            console.log(`Email ID:${emailID}`);
            console.log(`Current Year:${currentYear}`);

            //Displaying results of mathematical operations
            console.log(`Addition Result:${addition}`);
            console.log(`Subtraction Result:${subtraction}`);
            console.log(`Multiplication Result:${multiplication}`);
            console.log(`Division Result:${division}`);
            console.log(`Modulus Result:${modulus}`);
           
        </script>
    </body>
</html>
