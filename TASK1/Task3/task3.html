<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Simple Interest
        </title>
    </head>
    <body>
        <script>
            // Declaring variables 

            let principal = 10000;   // Principal amount
            let rate = 5;            // Rate of interest
            let time = 2;            // Time period in years

            // Calculating simple interest using formula

            let simpleInterest = (principal * rate * time) / 100;

            // Displaying final result in sentence format

            console.log(`The simple interest for principal ${principal} at rate ${rate}% for ${time} years is ${simpleInterest}`);

  </script>

</body>
</html>
