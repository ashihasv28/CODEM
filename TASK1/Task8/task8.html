<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            Student Mark Calculation Program
        </title>
    </head>
    <body>
        <script>

            // Marks of five subjects

            let maths = 80;
            let science = 75;
            let social = 85;
            let english = 90;
            let tamil = 70;

            // Calculating total marks

            let total = maths + science + social + english + tamil;

            // Calculating average marks

            let average = total / 5;

            // Displaying results

            console.log(`Total Marks:${total}`);
            console.log(`Average Marks: ${average}`);
            
        </script>

    </body>
</html>
