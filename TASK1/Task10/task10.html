<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>
            JavaScript Utility Program
        </title>
    </head>
    <body>
        <script>

            //creating variables
            let userName = 'Ashiha';
            let age = 19;

            //declaring marks for five subjects
            let physics = 93;
            let maths = 98;
            let chemistry = 86;
            let python = 93;
            let english = 91;

            //calculating total marks
            let total = physics+maths+chemistry+python+english;

            //calculating average marks
            let average = total/5;

            //converting the user name to uppercase
            let upperCase = userName.toUpperCase();

            //finding the length of the username
            let length = userName.length;

            //Displaying the results
            console.log(`Name:${userName}`); //username
            console.log(`Age:${age}`); //age 
            console.log(`Uppercase:${upperCase}`); //in uppercase 
            console.log(`Name Length:${length}`); //length of the string
            console.log(`Total Marks:${total}`);  //total marks
            console.log(`Average Marks:${average}`); //average marks

        </script>
    </body>
</html>
