<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Selecting Elements and Updating Content</title>
</head>
<body>
  <h1 id="title">Old Title</h1>
  <p class="text">This is the first text</p>
  <p class="text">This is the second text</p>
  <div class="box">Old box</div>
  <script>
    //selecting the Id
    let title= document.getElementById("title");
    //selecting the class
    let text= document.getElementsByClassName("text");
    //selecting by querySelector
    let box= document.querySelector(".box");

    //changing the text
    title.textContent="New Title";

    text[0].textContent="Updated Text";
    text[1].textContent="Updated Text";

    box.textContent="Updated Box";

    //changing atleast two styles
    title.style.color="blue";
    title.style.fontSize="30px";

    text[0].style.color="green";
    text[1].style.color="green";

    box.style.backgroundColor="yellow";
    box.style.color="red";

  </script>
</body>
</html>
