<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive To-Do List with Validation</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 40px;
        }

        input {
            padding: 8px;
            width: 200px;
        }

        button {
            padding: 8px 12px;
            margin-left: 5px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
            margin-top: 20px;
        }

        li {
            margin: 10px 0;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .error {
            color: red;
            margin-top: 10px;
        }
    </style>
  </head>
  <body>
    <script>
      //creating objects to store tasks
      const todoData = {
        tasks: []
      };

      //creating inputs
      const input = document.createElement("input");
      input.placeholder = "Enter task";
      const addButton = document.createElement("button");
      addButton.textContent = "Add Task";

      const errorMsg = document.createElement("div");
      errorMsg.classList.add("error");

      const taskList = document.createElement("ul");

      document.body.appendChild(input);
      document.body.appendChild(addButton);
      document.body.appendChild(errorMsg);
      document.body.appendChild(taskList);
      
      function addTask() {
        const taskText = input.value.trim();
        if (taskText === "") {
            errorMsg.textContent = "Task cannot be empty!";
            return;
        }

        errorMsg.textContent = "";

        const taskObject = {
            id: Date.now(),
            text: taskText,
            completed: false
        };

todoData.tasks.push(taskObject);

        renderTasks();
        input.value = "";
    }

    //render tasks
    function renderTasks() {
        taskList.innerHTML = "";

        todoData.tasks.forEach(task => {
            const li = document.createElement("li");

            const span = document.createElement("span");
            span.textContent = task.text;

            if (task.completed) {
                span.classList.add("completed");
            }

            //completing the button
            const completeBtn = document.createElement("button");
            completeBtn.textContent = "Complete";
            completeBtn.addEventListener("click", () => {
                task.completed = !task.completed;
                renderTasks();
            });

            // Delete button
            const deleteBtn = document.createElement("button");
            deleteBtn.textContent = "Delete";
            deleteBtn.addEventListener("click", () => {
                todoData.tasks = todoData.tasks.filter(t => t.id !== task.id);
                renderTasks();
            });

            //append
            li.appendChild(span);
            li.appendChild(completeBtn);
            li.appendChild(deleteBtn);

            taskList.appendChild(li);
        });
    }

    addButton.addEventListener("click", addTask);
</script>

</body>
</html>
