<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advanced Function Operation</title>
</head>
<body>
  <script>
    function calculateSum(a,b){
      return a+b;
    };
    
    function calculateProduct(a,b){
      return a*b;
    };
    
    //calling functions
    let sumResult=calculateSum(2,5);
    let productResult=calculateProduct(8,3);

    //displaying
    console.log('Sum of two numbers:',sumResult);
    console.log('Product of two numbers:',productResult);
    
  </script>
</body>
</html>
